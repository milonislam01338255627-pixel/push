<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PushSaaS ড্যাশবোর্ড</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f6f7f9;color:#222}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
input,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #ccc}
button{background:#4f46e5;color:#fff;border:0;cursor:pointer}
pre{background:#111;color:#9f9;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.small{color:#666;font-size:13px}
</style></head><body>
<h2>🔔 PushSaaS</h2>
<div id="auth" class="card">
  <input id="email" placeholder="ইমেইল" type="email">
  <input id="pass" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" type="password">
  <button onclick="login('login')">লগইন</button>
  <button onclick="login('signup')" style="background:#059669">নতুন অ্যাকাউন্ট</button>
  <div id="err" class="small" style="color:#c00"></div>
</div>
<div id="main" style="display:none">
  <div class="card"><b id="me"></b><div class="small" id="usage"></div>
    <button onclick="logout()" style="background:#777">লগআউট</button></div>
  <div class="card"><b>নতুন অ্যাপ</b>
    <input id="appname" placeholder="অ্যাপ/ওয়েবসাইটের নাম">
    <button onclick="createApp()">তৈরি করুন</button></div>
  <div id="apps"></div>
</div>
<script>
var T = localStorage.getItem("t");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function api(p, m, b){
  var r = await fetch(p,{method:m||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:b?JSON.stringify(b):undefined});
  var j = await r.json(); if(!r.ok) throw new Error(j.error||"সমস্যা"); return j;
}
async function login(kind){
  try{
    var r = await fetch("/api/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:email.value,password:pass.value})});
    var j = await r.json(); if(!r.ok) throw new Error(j.error);
    T=j.token; localStorage.setItem("t",T); load();
  }catch(e){err.textContent=e.message}
}
function logout(){localStorage.removeItem("t");location.reload()}
async function createApp(){
  try{ await api("/api/apps","POST",{name:appname.value}); appname.value=""; load(); }catch(e){alert(e.message)}
}
async function testSend(key,id){
  var t=document.getElementById("t"+id).value||"পরীক্ষা", b=document.getElementById("b"+id).value||"হ্যালো!";
  try{ var j=await api("/v1/send","POST",{title:t,body:b}); alert("পাঠানো: "+j.sent+", ব্যর্থ: "+j.failed);}catch(e){alert(e.message)}
}
async function load(){
  if(!T) return;
  try{
    var me=await api("/api/me"); var apps=await api("/api/apps");
    auth.style.display="none"; main.style.display="block";
    document.getElementById("me").textContent=me.email;
    usage.textContent="প্ল্যান: "+me.plan+" | এই মাসে "+me.sent+" / "+me.limit;
    var h=location.origin;
    document.getElementById("apps").innerHTML=apps.map(function(a){return '<div class="card"><b>'+esc(a.name)+'</b> <span class="small">('+a.devices+' ডিভাইস)</span>'
      +'<div class="small">App ID: '+esc(a.id)+'</div><div class="small">API Key (গোপন রাখুন):</div><pre>'+esc(a.api_key)+'</pre>'
      +'<div class="small">ওয়েবসাইটে বসান:</div><pre>'+esc('<script src="'+h+'/sdk.js" data-app-id="'+a.id+'"></scr'+'ipt>\n<button onclick="PushSaaS.subscribe()">নোটিফিকেশন চালু করুন</button>')+'</pre>'
      +'<div class="small">সাইটের রুটে /pushsaas-sw.js ফাইল বানান, ভেতরে:</div><pre>'+esc('importScripts("'+h+'/sw-core.js");')+'</pre>'
      +'<input id="t'+a.id+'" placeholder="টাইটেল"><input id="b'+a.id+'" placeholder="মেসেজ">'
      +'<button onclick="send(\''+a.id+'\',\''+a.api_key+'\')">টেস্ট নোটিফিকেশন পাঠান</button></div>'}).join("");
  }catch(e){ localStorage.removeItem("t"); T=null; }
}
async function send(id,key){
  var t=document.getElementById("t"+id).value||"পরীক্ষা", b=document.getElementById("b"+id).value||"হ্যালো!";
  var r=await fetch("/v1/send",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({title:t,body:b})});
  var j=await r.json(); alert(r.ok?("পাঠানো: "+j.sent+", ব্যর্থ: "+j.failed):j.error); load();
}
load();
</script></body></html>
