<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b5c">
<title>লগইন — MPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="auth">
  <div class="auth-side">
    <a class="brand" href="/" style="color:#fff">MPNS</a>
    <div>
      <h2>ভিজিটরের ফোনে নোটিফিকেশন, আপনার হাতে</h2>
      <div class="notif" style="margin-top:26px"><div class="top"><span class="ic"></span>আপনার সাইট • এখন</div><b>নতুন অর্ডার এসেছে 🛒</b>আপনার দোকানে একটা অর্ডার হয়েছে</div>
      <div class="notif" style="margin-top:12px"><div class="top"><span class="ic"></span>আপনার সাইট • ২ মি.</div><b>অফার শেষ হচ্ছে</b>আজ রাতের মধ্যেই ২০% ছাড়</div>
    </div>
    <div class="sm" style="opacity:.8">© M.P.N.S</div>
  </div>
  <div class="auth-main"><div class="auth-box">
    <h1>আবার স্বাগতম</h1><p class="m">আপনার ড্যাশবোর্ডে ঢুকুন।</p>
    <div class="fld"><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="fld"><label for="pass">পাসওয়ার্ড</label><input id="pass" type="password" autocomplete="current-password" placeholder="কমপক্ষে ৬ অক্ষর"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn block big" id="sb">লগইন করুন</button>
    <p class="m" style="margin-top:18px;text-align:center">নতুন? <a href="/signup" style="color:var(--pine);font-weight:600">ফ্রি অ্যাকাউন্ট খুলুন</a></p>
  </div></div>
</div>
<script src="/common.js"></script>
<script>
var KIND="login";
function nxt(){var n=new URLSearchParams(location.search).get("next");return n&&n[0]==="/"&&n[1]!=="/"?n:"/dashboard"}
if(TOK())location.href=nxt();
async function go(){
  var b=$("sb");b.disabled=true;$("err").textContent="";
  try{
    var r=await fetch("/api/"+KIND,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pass").value})});
    var j=await r.json();if(!r.ok)throw new Error(j.error);
    localStorage.setItem("t",j.token);location.href=nxt();
  }catch(e){$("err").textContent=e.message;b.disabled=false}
}
$("sb").onclick=go;$("pass").onkeydown=function(e){if(e.key==="Enter")go()};
</script></body></html>
